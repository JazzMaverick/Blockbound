<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ashvale RTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
/* VOICE: heroic and crafted, like a war table in a keep.
   IDEA: a carved stone-and-brass command frame around a living battlefield.
   PICTURE: the 3D battle itself, full bleed; title runs an AI skirmish behind the menu.
   COLOUR and TYPE: slate stone panels, parchment gold text, heraldic crimson for the main action; Cinzel titles, Alegreya Sans body.
   LAYOUT: battlefield edge to edge, HUD frame along the bottom (minimap | selection | command card). */
:root{color-scheme:dark;--stone:#1d2024;--stone2:#2a2e33;--edge:#5f5646;--edge2:#8a7a5a;--gold:#ecd9a0;--gold2:#c9a75a;--ink:#efe8d8;--mut:#a59e90;--red:#b8322a;--ok:#4cc867;--bad:#ff5a4a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
:root:lang(zh-Hant) body,:root:lang(zh-Hant) button,:root:lang(zh-Hant) input,:root:lang(zh-Hant) select{font-family:"Noto Sans TC","Alegreya Sans",system-ui,sans-serif}
:root:lang(zh-Hant) h1,:root:lang(zh-Hant) h2,:root:lang(zh-Hant) h3,:root:lang(zh-Hant) #boot,:root:lang(zh-Hant) .code{font-family:"Noto Serif TC",Cinzel,serif}
:root:lang(zh-Hant) .brand h1{letter-spacing:.08em}
.lang{justify-content:space-between;border-top:1px solid #3d3a33;padding-top:12px}.lang select{min-width:140px}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#121516;color:var(--ink);font:16px/1.45 "Alegreya Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl,#ov{position:fixed;inset:0;display:block}
#gl{touch-action:none;outline:none}
#ov{pointer-events:none}
h1,h2,h3{font-family:Cinzel,serif;color:var(--gold);margin:0;line-height:1.05;text-wrap:balance}
.screen{position:fixed;inset:0;display:none;pointer-events:none}
.screen.on{display:flex}
.screen>*{pointer-events:auto}
.panel{background:linear-gradient(180deg,var(--stone2),var(--stone));border:2px solid var(--edge);border-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.55)}
button{font:inherit;font-weight:600;color:var(--ink);background:linear-gradient(#3b4046,#262a2f);border:1px solid #6d6350;border-radius:6px;min-height:44px;padding:0 16px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--gold2);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:linear-gradient(#c8463a,#8c231b);border-color:#e88a6f;color:#fff6e8}
button.ghost{background:transparent}
button:disabled{opacity:.42;cursor:not-allowed}
button.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2);color:var(--gold)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#14171a;border:1px solid #6d6350;border-radius:6px;min-height:44px;padding:0 10px}
textarea{width:100%;min-height:120px;padding:10px;font:13px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text}
label{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
#boot{position:fixed;inset:0;display:grid;place-items:center;font:600 18px Cinzel,serif;color:var(--gold);background:#121516;z-index:50;text-align:center;padding:24px}

/* title */
#title{align-items:stretch;justify-content:space-between;padding:max(28px,4vw);gap:24px;background:radial-gradient(ellipse at 30% 40%,rgba(10,12,12,.05),rgba(10,12,12,.78) 75%)}
.brand{align-self:flex-end;max-width:520px;pointer-events:none}
.brand h1{font-size:clamp(44px,7vw,84px);letter-spacing:.02em;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.brand p{font-size:19px;color:#e6dcc5;margin:10px 0 0;text-shadow:0 2px 10px #000}
.brand .badge{margin-top:16px;display:inline-block;font-size:13px;color:var(--gold);border:1px solid var(--edge2);border-radius:20px;padding:3px 12px;background:rgba(0,0,0,.45)}
.menu{align-self:center;width:min(380px,100%);padding:22px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid #3d3a33}
.who img{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge2);background:#333}
.who b{display:block;font-size:17px}.who span{font-size:13px;color:var(--mut)}
.join{display:grid;grid-template-columns:1fr auto;gap:8px}
.join input{text-transform:uppercase;letter-spacing:.25em;font-weight:700}
.note{font-size:13px;color:var(--mut);margin:0}
@media(max-width:760px){#title{flex-direction:column;justify-content:flex-end}.brand{align-self:flex-start}.brand h1{font-size:44px}}

/* lobby */
#lobby{align-items:center;justify-content:center;padding:16px;background:rgba(8,10,10,.55)}
.lob{width:min(860px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.code{font:700 30px Cinzel,serif;letter-spacing:.2em;color:#fff}
.slot{display:grid;grid-template-columns:14px minmax(0,1fr) 128px 104px 210px;gap:8px;align-items:center;padding:8px 10px;background:rgba(0,0,0,.25);border:1px solid #3a372f;border-radius:6px}
.slot .pick{grid-column:5}
.chip{width:14px;height:44px;border-radius:3px}
.slot .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm small{font-weight:500;color:var(--mut);margin-left:6px}
@media(max-width:820px){.slot{grid-template-columns:12px minmax(0,1fr) 120px 104px}.slot .pick{grid-column:2/5}}
@media(max-width:600px){.slot{grid-template-columns:10px minmax(0,1fr) 110px}.slot .team{grid-column:2/3}.slot .pick{grid-column:2/4}}
.preview{display:flex;gap:14px;align-items:center}
.preview canvas{width:96px;height:96px;border:1px solid var(--edge);border-radius:4px;image-rendering:pixelated}

/* hud */
#hud{flex-direction:column;justify-content:space-between}
#top{align-self:center;margin-top:8px;display:flex;gap:6px;align-items:center;padding:4px 8px;min-height:52px;flex-wrap:wrap;justify-content:center}
#top button{min-height:40px;padding:0 12px}
#bSnd svg{width:22px;height:22px}
.res{display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;position:relative}
.res svg{width:20px;height:20px}
.res.gold{color:#ffd76a}.res.wood{color:#d7b07a}.res.food{color:#e9e2cf}
.res.pulse{animation:pulse .5s}
@keyframes pulse{30%{transform:scale(1.18)}}
.spend{position:absolute;left:26px;top:calc(100% + 6px);font-weight:800;color:var(--bad);pointer-events:none;animation:rise 1.1s forwards;text-shadow:0 1px 3px #000}
.spend.plus{color:#7dff8a}
@keyframes rise{to{transform:translateY(22px);opacity:0}}
#clock{font-variant-numeric:tabular-nums;color:var(--mut);padding:0 8px}
#plist{display:flex;gap:6px;padding-left:6px}
.pl{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);background:rgba(0,0,0,.3);border-radius:12px;padding:2px 9px 2px 5px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl i{width:10px;height:10px;border-radius:50%;flex:none}.pl.out{opacity:.45;text-decoration:line-through}
#bottom{display:grid;grid-template-columns:196px minmax(0,1fr) 272px;gap:8px;padding:8px;margin:0 auto 8px;width:min(1100px,calc(100% - 16px));height:200px}
#mini{width:180px;height:180px;border:2px solid var(--edge);border-radius:4px;background:#111;touch-action:none;cursor:crosshair}
.minibox{position:relative;display:flex;align-items:center;justify-content:center}
#info{padding:6px 10px;overflow:hidden;display:flex;flex-direction:column;gap:6px}
#info h3{font-size:19px}
.bar{height:12px;border-radius:3px;background:#0b0c0d;border:1px solid #000;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar.mp>i{background:#4f8dff}.bar.xp>i{background:#c58cff}
.bar b{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.stats{font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.pic{height:46px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0}
.pic svg{width:24px;height:24px}
.pic .bar{width:80%;height:5px}
.queue{display:flex;gap:6px;align-items:center}
.queue .pic{width:46px}
#card{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:5px;padding:7px}
.cmd{position:relative;padding:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cmd svg{width:26px;height:26px}
.cmd .hk{position:absolute;top:2px;left:4px;font-size:11px;color:var(--gold);font-weight:800}
.cmd .cost{font-size:10.5px;color:#ffd76a;line-height:1}
.cmd .cd{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:5px;transform-origin:bottom}
.cmd.empty{background:rgba(0,0,0,.25);border-color:#2c2b27;pointer-events:none}
#tools{position:fixed;right:8px;bottom:216px;display:flex;flex-direction:column;gap:6px}
#tools button{width:56px;height:52px;padding:0;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(rgba(59,64,70,.92),rgba(38,42,47,.92))}
#tools svg{width:22px;height:22px}
#tools .tab{display:none}
body.tablet #tools .tab{display:flex}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20}
#toast div{background:rgba(20,22,24,.92);border:1px solid var(--edge2);color:#ffe6b0;padding:8px 16px;border-radius:6px;font-weight:700;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#tip{position:fixed;display:none;max-width:280px;padding:10px 12px;font-size:14px;pointer-events:none;z-index:30}
#tip b{color:var(--gold);font-size:15px}
#mode{position:fixed;left:50%;bottom:222px;transform:translateX(-50%);padding:6px 14px;font-weight:700;color:var(--gold);display:none;align-items:center;gap:10px}
#mode.on{display:flex}
body.tablet #bottom{height:214px}
body.tablet #card{gap:6px}
body.tablet .cmd svg{width:30px;height:30px}
@media(max-width:900px){#bottom{grid-template-columns:150px minmax(0,1fr) 236px;height:186px}#mini{width:138px;height:138px}#tools{bottom:200px}#mode{bottom:204px}}
@media(max-width:640px){#bottom{grid-template-columns:108px minmax(0,1fr) 200px;height:170px;padding:5px;gap:5px}#mini{width:100px;height:100px}#info h3{font-size:16px}.stats{font-size:12px}#tools{bottom:182px}#top .res{font-size:15px;padding:0 5px}#plist{display:none}}

@media(max-height:520px){#bottom,body.tablet #bottom{height:126px;padding:4px;gap:4px;grid-template-columns:116px minmax(0,1fr) 208px;margin-bottom:4px}#mini{width:108px;height:108px}#info{gap:3px;padding:2px 6px}#info .stats{display:none}#info h3{font-size:15px}#card{gap:3px;padding:3px}.cmd svg,body.tablet .cmd svg{width:22px;height:22px}.cmd .cost{display:none}#tools{flex-direction:row;flex-wrap:wrap-reverse;justify-content:flex-end;bottom:134px;max-width:calc(100% - 16px)}#tools button{width:50px;height:44px}#mode{bottom:190px}#top{margin-top:4px;min-height:44px;padding:2px 6px}#top button{min-height:36px}}
#chatLog{position:fixed;left:12px;bottom:218px;width:min(420px,60vw);display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:15}
.cl{background:rgba(12,14,16,.72);border-radius:5px;padding:4px 9px;font-size:15px;color:#f1ead8;overflow-wrap:anywhere;transition:opacity 1s}
.cl.old{opacity:0}
#chatBox{position:fixed;left:50%;bottom:226px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:none;gap:6px;padding:6px;z-index:25}
#chatBox.on{display:flex}#chatIn{flex:1;user-select:text;-webkit-user-select:text}#chatTo{min-width:70px}
@media(max-height:520px){#chatLog{bottom:138px}#chatBox{bottom:140px}}
/* editor */
#editor{flex-direction:column;justify-content:space-between;pointer-events:none}
#etop{margin:8px;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#etop input{width:200px}
#epal{position:fixed;left:8px;top:76px;bottom:8px;width:200px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
#epal h3{font-size:14px;margin-top:6px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools button{padding:0 6px;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:flex-start;line-height:1.15;text-align:left}
:root:lang(zh-Hant) .tools button{padding:0 5px;gap:5px;font-size:13px;letter-spacing:0;white-space:nowrap}
@media(max-width:640px){:root:lang(zh-Hant) .tools button{white-space:normal}}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.5)}
#ehint{position:fixed;left:220px;bottom:12px;padding:8px 12px;font-size:14px;color:var(--mut)}
@media(max-width:640px){#epal{width:150px}#ehint{display:none}}

/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,7,.6);z-index:40;padding:16px}
#modal.on{display:flex}
#mbody{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
#mbody h2{font-size:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv b{color:var(--gold);white-space:nowrap}
.maps{display:flex;flex-direction:column;gap:6px}
.maps .row{justify-content:space-between;background:rgba(0,0,0,.25);padding:6px 10px;border-radius:6px}
.maps .meta{font-size:13px;color:var(--mut)}
.lad{width:100%;border-collapse:collapse;font-size:15px}.lad td,.lad th{padding:6px 8px;border-bottom:1px solid #3a372f;text-align:left}.lad td.n{text-align:right;font-variant-numeric:tabular-nums}.lad tr.me td{color:var(--gold);font-weight:700}
.tabs{display:flex;gap:6px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:35;background:radial-gradient(rgba(0,0,0,.2),rgba(0,0,0,.75))}
#over.on{display:flex}
#over .panel{padding:28px 36px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#over h1{font-size:52px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Battlefield"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="boot" data-i18n="Raising the banners…">Raising the banners…</div>

<section id="title" class="screen" aria-label="Title">
  <div class="brand">
    <h1 data-i18n="Ashvale">Ashvale</h1>
    <p data-i18n="Real-time strategy for 1–4 players. Gather gold and lumber, raise an army, lead your hero.">Real-time strategy for 1–4 players. Gather gold and lumber, raise an army, lead your hero.</p>
    <span class="badge" id="gpu">Starting renderer…</span>
  </div>
  <div class="menu panel">
    <div class="who" id="who"><img id="avatar" alt=""><div style="flex:1"><b id="whoName">Loading account…</b><span id="whoLine">Checking sign-in</span></div><button class="ghost" id="bSignOut" hidden style="min-height:36px;padding:0 10px" data-i18n="Sign out">Sign out</button></div>
    <button class="primary" id="bSignIn" hidden data-i18n="Sign in with Google">Sign in with Google</button>
    <button class="primary" id="bHost" data-i18n="Host online game">Host online game</button>
    <div class="join"><input id="joinCode" maxlength="6" placeholder="Room code" aria-label="Room code" data-i18n-ph="Room code" data-i18n-aria="Room code" autocomplete="off"><button id="bJoin" data-i18n="Join">Join</button></div>
    <p class="note" id="netNote"></p>
    <button id="bSolo" data-i18n="Play vs computer">Play vs computer</button>
    <button id="bEdit" data-i18n="Map editor">Map editor</button>
    <div class="row"><button class="ghost" id="bSettings" data-i18n="Settings">Settings</button><button class="ghost" id="bHelp" data-i18n="How to play">How to play</button><button class="ghost" id="bLadder" hidden data-i18n="Ladder">Ladder</button></div>
    <div class="row lang"><label for="langSel">語言 · Language</label><select id="langSel"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></div>
  </div>
</section>

<section id="lobby" class="screen" aria-label="Lobby">
  <div class="lob panel">
    <div class="row" style="justify-content:space-between"><div><label data-i18n="Room code">Room code</label><div class="code" id="lCode">----</div></div><button id="bCopy" data-i18n="Copy code">Copy code</button></div>
    <div id="slots" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="preview"><canvas id="lPrev" width="64" height="64"></canvas><div style="flex:1"><label for="lMap" data-i18n="Map">Map</label><br><div class="row" style="flex-wrap:nowrap"><select id="lMap" style="flex:1"></select><button id="lLib" hidden data-i18n="Library">Library</button></div><p class="note" id="lMapNote"></p></div></div>
    <div class="row"><label class="row" for="lFog" style="color:var(--ink);font-size:16px"><input type="checkbox" id="lFog" style="width:22px;height:22px;min-height:0"> <span data-i18n="Fog of war">Fog of war</span></label>
    <label class="row" for="lRanked" id="lRankedRow" hidden style="color:var(--ink);font-size:16px"><input type="checkbox" id="lRanked" style="width:22px;height:22px;min-height:0"> <span data-i18n="Ranked match">Ranked match</span> <span class="mut" style="font-size:13px" data-i18n="(players only, counts on the ladder)">(players only, counts on the ladder)</span></label></div>
    <p class="note" id="lStatus"></p>
    <div class="row" style="justify-content:flex-end"><button id="bLeave" data-i18n="Leave">Leave</button><button class="primary" id="bStart" data-i18n="Start game">Start game</button></div>
  </div>
</section>

<section id="hud" class="screen" aria-label="Game">
  <div id="top" class="panel">
    <button id="bMenu" data-i18n="Menu">Menu</button>
    <button id="bSnd" aria-label="Sound on" style="width:44px;padding:0;display:grid;place-items:center"></button>
    <div class="res gold" id="cG"></div><div class="res wood" id="cL"></div><div class="res food" id="cF"></div>
    <div id="clock">0:00</div><div id="plist"></div>
  </div>
  <div id="tools">
    <button class="tab" id="tBox">BOX</button><button class="tab" id="tAdd">ADD</button>
    <button id="tChat">CHAT</button><button id="tArmy">ARMY</button><button id="tIdle">IDLE</button><button id="tHero">HERO</button>
    <button class="tab" id="tClear">CLEAR</button><button class="tab" id="tZin">ZOOM +</button><button class="tab" id="tZout">ZOOM −</button>
  </div>
  <div id="chatLog" aria-live="polite"></div>
  <div id="chatBox" class="panel"><button id="chatTo" type="button">All</button><input id="chatIn" maxlength="120" placeholder="Message" aria-label="Chat message" data-i18n-ph="Message" autocomplete="off"><button id="chatSend" class="primary" type="button" data-i18n="Send">Send</button></div>
  <div id="mode" class="panel"><span id="modeTxt"></span><button id="modeX" style="min-height:36px" data-i18n="Cancel">Cancel</button></div>
  <div id="bottom" class="panel">
    <div class="minibox"><canvas id="mini" width="180" height="180" aria-label="Minimap"></canvas></div>
    <div id="info"></div>
    <div id="card"></div>
  </div>
</section>

<section id="editor" class="screen" aria-label="Map editor">
  <div id="etop" class="panel">
    <input id="eName" maxlength="32" aria-label="Map name" data-i18n-aria="Map name">
    <select id="eSize" aria-label="New map size"><option value="48">48 × 48</option><option value="64">64 × 64</option><option value="32">32 × 32</option></select>
